{% extends "home.html" %}
{% block title %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter OTP</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
        }

        .otp-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            width: 400px;
            text-align: center;
            margin: 50px auto;
        }

        .otp-container h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .otp-inputs {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .otp-input {
            width: 50px;
            height: 50px;
            font-size: 24px;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
        }

        .otp-input:focus {
            border-color: #4CAF50;
        }

        .otp-input:invalid {
            border-color: #f44336;
        }

        .otp-submit {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .otp-submit:hover {
            background-color: #45a049;
        }

        .resend-link {
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
            margin-top: 15px;
            display: block;
        }

        .resend-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="otp-container">
        <h2>Enter OTP</h2>
        <p>Please enter the 6-digit OTP sent to your email.</p>

        <!-- Form to send OTP -->
        <form action="{% url 'download' id %}" method="post">
        
            {% csrf_token %}
            <div class="otp-inputs">
                <input type="text" class="otp-input" name="otp1" maxlength="1" id="otp1" oninput="moveFocus(this, 'otp2')" required>
                <input type="text" class="otp-input" name="otp2" maxlength="1" id="otp2" oninput="moveFocus(this, 'otp3')" required>
                <input type="text" class="otp-input" name="otp3" maxlength="1" id="otp3" oninput="moveFocus(this, 'otp4')" required>
                <input type="text" class="otp-input" name="otp4" maxlength="1" id="otp4" oninput="moveFocus(this, 'otp5')" required>
                <input type="text" class="otp-input" name="otp5" maxlength="1" id="otp5" oninput="moveFocus(this, 'otp6')" required>
                <input type="text" class="otp-input" name="otp6" maxlength="1" id="otp6" required>
            </div>

            <button type="submit" class="otp-submit">Submit OTP</button>
        </form>

        <!-- <a href="#" class="resend-link">Didn't receive the OTP? Resend</a> -->
    </div>

    <script>
        function moveFocus(current, nextField) {
            if (current.value.length == current.maxLength) {
                document.getElementById(nextField).focus();
            }
        }
    </script>

</body>
{% endblock %}
